<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeDock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="dock-body">

  <aside id="rail" class="cyber-rail">
    <!-- Header Controls -->
    <div class="rail-header">
      <button id="close-btn" class="action-btn" title="Hide Dock (Alt+Space)">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>

      <button id="toggle-add-btn" class="action-btn" title="Add Shortcut or Drop Files">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>

    <!-- Shortcut Stream -->
    <main id="launcher-list" class="icon-stream"></main>

    <!-- Power Tools Section -->
    <div class="tools-divider"></div>
    <div class="rail-tools">
      <button id="tool-ytdl-btn" class="action-btn tool-btn" title="Media & YouTube Downloader">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      </button>

      <button id="tool-clipboard-btn" class="action-btn tool-btn" title="Clipboard History">
        <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 0.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
      </button>

      <button id="tool-scratchpad-btn" class="action-btn tool-btn" title="Quick Scratchpad">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
    </div>

    <!-- Footer Controls -->
    <div class="rail-footer">
      <button id="toggle-autohide-btn" class="action-btn" title="Toggle Auto-Hide">
        <svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
      </button>
      <button id="open-settings-btn" class="action-btn" title="Dock Preferences">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Flyout Add / Edit Drawer -->
  <div id="drawer" class="dock-drawer">
    <div class="drawer-title" id="drawer-title">Add Shortcut</div>
    <form id="shortcut-form">
      <input type="hidden" id="item-id" />
      <div class="form-group">
        <label for="app-name">Display Name</label>
        <input type="text" id="app-name" class="form-input" placeholder="e.g. VS Code, Chrome, Terminal" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="app-path">Path or Web URL</label>
        <div class="form-input-row">
          <input type="text" id="app-path" class="form-input" placeholder="C:\path\to\app.exe or https://..." required autocomplete="off" />
          <button type="button" id="browse-btn" class="browse-btn">Browse</button>
        </div>
      </div>

      <div class="drawer-actions">
        <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
        <button type="submit" id="save-btn" class="btn-primary">Save Pin</button>
      </div>
    </form>
  </div>

  <!-- Power Tool Drawer: Media / YouTube Downloader -->
  <div id="ytdl-drawer" class="dock-drawer">
    <div class="drawer-header">
      <div class="drawer-title">Media Downloader</div>
      <div id="ytdl-engine-badge" class="engine-badge checking">Checking engine...</div>
    </div>

    <!-- Engine Setup Banner (hidden if ready) -->
    <div id="ytdl-setup-box" class="setup-box hidden">
      <div class="setup-text">Download engine (yt-dlp) required to process YouTube and web video/audio streams.</div>
      <button type="button" id="install-engine-btn" class="btn-primary mini">Setup Engine (1-Click)</button>
      <div id="setup-progress-bar" class="progress-container hidden">
        <div class="progress-bar-fill" id="setup-progress-fill"></div>
      </div>
    </div>

    <form id="ytdl-form">
      <div class="form-group">
        <label for="ytdl-url-input">Video Link or Search Title</label>
        <input type="text" id="ytdl-url-input" class="form-input" placeholder="https://youtube.com/watch?v=... or song name" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label>Format</label>
        <div class="segmented-control">
          <button type="button" class="segment-btn active" data-format="mp4">🎬 MP4 Video</button>
          <button type="button" class="segment-btn" data-format="mp3">🎵 MP3 Audio</button>
        </div>
      </div>

      <!-- Live Download Progress -->
      <div id="download-progress-box" class="download-progress-box hidden">
        <div class="progress-status" id="download-status-text">Starting download...</div>
        <div class="progress-container">
          <div class="progress-bar-fill" id="download-progress-fill" style="width: 0%;"></div>
        </div>
        <div class="progress-meta" id="download-meta-text">0% • -- MiB/s • ETA --:--</div>
      </div>

      <div class="drawer-actions">
        <button type="button" id="open-downloads-btn" class="btn-secondary" title="Open Downloads Folder">📁 Downloads</button>
        <button type="submit" id="start-download-btn" class="btn-primary">Download</button>
      </div>
    </form>
  </div>

  <!-- Power Tool Drawer: Clipboard History -->
  <div id="clipboard-drawer" class="dock-drawer">
    <div class="drawer-header">
      <div class="drawer-title">Clipboard History</div>
      <button type="button" id="clear-clipboard-btn" class="mini-text-btn">Clear All</button>
    </div>
    <div class="form-group">
      <input type="text" id="clipboard-search" class="form-input" placeholder="Search recent clips..." autocomplete="off" />
    </div>
    <div id="clipboard-list" class="clipboard-stream">
      <!-- Dynamically filled with clip cards -->
    </div>
  </div>

  <!-- Power Tool Drawer: Quick Scratchpad -->
  <div id="scratchpad-drawer" class="dock-drawer">
    <div class="drawer-header">
      <div class="drawer-title">Quick Scratchpad</div>
      <div id="scratchpad-saved-badge" class="saved-badge">Saved</div>
    </div>
    <div class="scratchpad-container">
      <textarea id="scratchpad-text" class="scratchpad-textarea" placeholder="Paste temporary tokens, code snippets, notes, or scratch ideas here... Auto-saves instantly."></textarea>
    </div>
    <div class="scratchpad-footer">
      <span id="scratchpad-counter" class="counter-text">0 chars • 0 words</span>
      <div class="drawer-actions compact">
        <button type="button" id="clear-scratchpad-btn" class="btn-secondary mini">Clear</button>
        <button type="button" id="copy-scratchpad-btn" class="btn-primary mini">Copy All</button>
      </div>
    </div>
  </div>

  <!-- Settings Drawer -->
  <div id="settings-drawer" class="dock-drawer">
    <div class="drawer-title">Preferences</div>
    <div class="settings-content">
      <div class="form-group">
        <label>Dock Screen Position</label>
        <div class="segmented-control" id="position-segmented">
          <button type="button" class="segment-btn active" data-position="right">Right Edge</button>
          <button type="button" class="segment-btn" data-position="left">Left Edge</button>
        </div>
      </div>

      <div class="form-group">
        <label>Cyber Theme Accent</label>
        <div class="color-picker-row">
          <button type="button" class="color-dot active" data-color="#00f2fe" style="background: #00f2fe;" title="Cyan Neon"></button>
          <button type="button" class="color-dot" data-color="#b537f2" style="background: #b537f2;" title="Synthwave Violet"></button>
          <button type="button" class="color-dot" data-color="#ffd32a" style="background: #ffd32a;" title="Cyber Yellow"></button>
          <button type="button" class="color-dot" data-color="#05c46b" style="background: #05c46b;" title="Matrix Emerald"></button>
          <button type="button" class="color-dot" data-color="#ff3f8b" style="background: #ff3f8b;" title="Pulse Crimson"></button>
        </div>
      </div>

      <div class="form-group">
        <label for="hotkey-input">Global Shortcut</label>
        <div class="form-input-row">
          <input type="text" id="hotkey-input" class="form-input" value="Alt+Space" />
          <button type="button" id="save-hotkey-btn" class="browse-btn">Apply</button>
        </div>
      </div>

      <div class="form-group checkbox-row">
        <label class="switch-label">
          <span>Launch on Windows Startup</span>
          <input type="checkbox" id="launch-boot-switch" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group checkbox-row">
        <label class="switch-label">
          <span>Auto-Hide on Inactivity</span>
          <input type="checkbox" id="autohide-switch" />
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="drawer-actions">
      <button type="button" id="close-settings-btn" class="btn-primary">Done</button>
    </div>
  </div>

  <!-- Right-Click Context Menu -->
  <div id="context-menu" class="context-menu">
    <div class="context-item" id="ctx-launch">
      <span>🚀</span> Launch
    </div>
    <div class="context-item" id="ctx-reveal">
      <span>📂</span> Reveal in Folder
    </div>
    <div class="context-item" id="ctx-edit">
      <span>✏️</span> Edit
    </div>
    <div class="context-divider"></div>
    <div class="context-item danger" id="ctx-delete">
      <span>🗑️</span> Remove Pin
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg"></div>

  <script src="app.js"></script>
</body>
</html>
